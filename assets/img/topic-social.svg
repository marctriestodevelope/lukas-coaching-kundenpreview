<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="title">
  <title id="title">Zwei zentrierte Theatermasken für Rollen und soziales Umfeld</title>
  <style>
    :root { --blue: #7ca3ff; --red: #f27979; --ink: #f5f5f2; --gold: #c5a059; --surface: #171819; }
    @media (prefers-color-scheme: light) {
      :root { --blue: #2755c7; --red: #a91d1d; --ink: #232830; --gold: #c5a059; --surface: #fff; }
    }
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 27c20-11 38-11 58-2l-2 38c-2 21-15 35-29 41-16-8-27-24-27-43Z" fill="var(--surface)" stroke="var(--blue)" stroke-width="3"/>
    <path d="M77 25c20-6 39-3 59 8l-4 37c-4 19-17 31-33 35-15-10-23-26-23-44Z" fill="var(--surface)" stroke="var(--red)" stroke-width="3"/>
    <path d="M33 48c6-5 12-5 18-1m11-1c5-3 9-3 13-1m11 5c6-3 12-2 17 2m10 1c5-2 10-1 15 2" fill="none" stroke="var(--ink)" stroke-width="3"/>
    <path d="M37 71c9 13 21 15 31 2m20 12c8-9 20-10 30-2" fill="none" stroke="var(--gold)" stroke-width="3.5"/>
    <path d="m56 54-4 10 6 1m48-7-4 10 6 2" fill="none" stroke="var(--ink)" stroke-width="2"/>
  </g>
</svg>
